# Drives the page through a real headless browser: rendering, the study link,
# the page walk, the saved file, the format guard and the network record.
#
# Two targets on different triggers. A pull request and a push to main test
# the checkout's own pages, which is the change under review. The weekly
# schedule and a manual run test the deployed page instead: nothing in this
# repository moves between them, and what they watch for is the page breaking
# under something that did, such as a new export published by the hitop
# package.
#
# The run goes red on an outage of jmgirard.github.io just as it does on a
# real break, after the one retry playwright.config.js allows.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:30 UTC.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the event as well as the ref, so a push to main cannot cancel the
# scheduled run of the deployed page that shares its ref.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # FORM_TARGET names the deployed page on the schedule and on a manual
      # run, and is empty otherwise. With it empty the tests serve this
      # checkout on localhost instead.
      #
      # FORM_REQUIRE_TARGET is set on exactly the two events that mean the
      # deployed page, and tells the tests to fail rather than fall back.
      # Without it, a dropped env: block or a renamed event would leave the
      # weekly run quietly testing this checkout and reporting green forever.
      - name: Run the tests
        env:
          FORM_TARGET: >-
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
                && 'https://jmgirard.github.io/hitop-form/' || '' }}
          FORM_REQUIRE_TARGET: >-
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
                && '1' || '' }}
        run: npx playwright test
