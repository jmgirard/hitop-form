<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>HiTOP form</title>
<style>
  /* Tokens. Colours are stated as a light set and redefined for the dark
     scheme; the page follows the operating system. Every text pair clears
     4.5:1 against the surface it is painted on. Shared with
     jmgirard/hitop-builder. */
  :root {
    --bg: #ffffff;
    --surface: #f4f6f8;
    --surface-2: #e9edf1;
    --fg: #16202b;
    --muted: #4d5a67;
    --accent: #185a8c;
    --accent-fg: #ffffff;
    --accent-weak: #dbe8f4;
    --line: #c7d0d9;
    --line-strong: #6f7d8b;
    --focus: #0b4f86;
    --error: #a3261c;
    --error-bg: #fbe9e7;
    --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem;
    --s5: 1.5rem; --s6: 2rem; --s7: 3rem;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --t-h1: 1.5rem; --t-body: 1.0625rem; --t-small: .875rem;
    --r1: 6px; --r2: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --surface: #1c2229;
      --surface-2: #262e37;
      --fg: #e6ebf0;
      --muted: #a3b0bd;
      --accent: #7ab8e8;
      --accent-fg: #0b1219;
      --accent-weak: #223343;
      --line: #3a444f;
      --line-strong: #78848f;
      --focus: #9ccbf0;
      --error: #f2a49b;
      --error-bg: #3a1f1c;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: var(--s5) var(--s4) var(--s7);
    max-width: 44rem;
    background: var(--bg);
    color: var(--fg);
    font: var(--t-body)/1.55 var(--font);
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: var(--t-h1); line-height: 1.2; margin: 0 0 var(--s2); }
  p { margin: 0 0 var(--s4); }
  .muted { color: var(--muted); font-size: var(--t-small); }
  .version { font-family: var(--mono); font-size: var(--t-small); color: var(--muted); }

  .instructions {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r2);
    padding: var(--s4) var(--s5);
    margin: 0 0 var(--s5);
  }

  /* One item: its position, its text, and the options as one radio group. */
  fieldset.item {
    border: 1px solid var(--line);
    border-radius: var(--r2);
    padding: var(--s3) var(--s4) var(--s4);
    margin: 0 0 var(--s4);
    background: var(--bg);
  }
  fieldset.item.unanswered { border-color: var(--error); }
  fieldset.item legend {
    padding: 0 var(--s2);
    font-weight: 600;
  }
  fieldset.item legend .pos { color: var(--muted); font-weight: 400; margin-right: var(--s2); }
  .options { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); margin-top: var(--s2); }
  .options label {
    display: inline-flex; align-items: center; gap: var(--s2);
    padding: var(--s1) var(--s2);
    border-radius: var(--r1);
    cursor: pointer;
  }
  .options label:hover { background: var(--surface); }
  .options input { margin: 0; width: 1.1rem; height: 1.1rem; }

  label.field { display: block; margin: 0 0 var(--s4); font-weight: 600; }
  label.field input {
    display: block; width: 100%; margin-top: var(--s1);
    font: inherit; padding: var(--s2) var(--s3);
    border: 1px solid var(--line-strong); border-radius: var(--r1);
    background: var(--bg); color: var(--fg);
  }

  .nav { display: flex; gap: var(--s3); align-items: center; margin-top: var(--s5); }
  .nav .spacer { flex: 1; }
  button {
    font: inherit; font-weight: 600;
    padding: var(--s2) var(--s5);
    border-radius: var(--r1);
    border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-fg);
    cursor: pointer;
  }
  button.secondary { background: var(--bg); color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  [role="alert"] {
    background: var(--error-bg); color: var(--error);
    border: 1px solid var(--error);
    border-radius: var(--r1);
    padding: var(--s3) var(--s4);
    margin: 0 0 var(--s4);
  }
  [role="alert"]:empty { display: none; }
  .progress { color: var(--muted); font-size: var(--t-small); margin: 0 0 var(--s4); }
  code { font-family: var(--mono); font-size: .95em; }
</style>
</head>
<body>
<main id="app">
  <p class="muted">Loading the form…</p>
</main>
<script type="module">
  import { boot } from './form.js';
  boot(document.getElementById('app'), window.location.search);
</script>
</body>
</html>
